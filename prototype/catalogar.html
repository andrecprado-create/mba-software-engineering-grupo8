<h1>Catalogar por foto</h1>
<p>Fotografe a capa inteira, de frente e com boa luz. Só a capa: nada de rostos ou documentos.</p>

<form action="confirmar.html" method="get">
  <p>
    <label for="foto">Foto da capa</label><br>
    <input id="foto" name="foto" type="file" accept="image/*" capture="environment">
  </p>
  <p><button type="submit"><strong>Ler capa</strong></button></p>
</form>

<p>Prefere digitar? <a href="manual.html">Preencher à mão</a></p>
