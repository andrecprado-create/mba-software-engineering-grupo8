<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmpCol — Emprestar</title>
</head>
<body>
<!-- Tela: Registrar empréstimo · História: US3 (cenários 1 a 3) -->
<p><a href="edicao.html">&larr; Voltar</a></p>
<h1>Emprestar Watchmen</h1>

<form action="comprovante.html" method="get">
  <fieldset>
    <legend>Para quem?</legend>
    <p><label><input type="radio" name="amigo" value="rafael" checked> Rafael Almeida</label></p>
    <p><label><input type="radio" name="amigo" value="carla"> Carla Souza</label></p>
    <p><label><input type="radio" name="amigo" value="novo"> Novo amigo</label></p>
    <p><label for="nome">Nome do novo amigo</label><br><input id="nome" name="nome"></p>
    <p><label for="contato">Celular ou e-mail</label><br><input id="contato" name="contato"></p>
  </fieldset>

  <p>
    <label for="devolucao">Devolução combinada</label><br>
    <input id="devolucao" name="devolucao" type="date" value="2026-12-10" min="2026-11-26">
    <br><small>Já preenchida com a sugestão de 14 dias (10/12). Troque se combinarem outra data; não pode ser no passado.</small>
  </p>

  <p><button type="submit"><strong>Confirmar empréstimo</strong></button></p>
</form>
</body>
</html>
